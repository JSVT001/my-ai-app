<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI Assistant</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 16px; background: #1e293b; text-align: center; font-weight: bold; border-bottom: 1px solid #334155; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: white; }
    .bot { align-self: flex-start; background: #334155; color: #f8fafc; }
    form { display: flex; padding: 12px; background: #1e293b; gap: 8px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; }
    button { padding: 12px 20px; border-radius: 8px; border: none; background: #2563eb; color: white; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <header>My Personal AI</header>
  <div id="chat"></div>
  <form id="chatForm">
    <input type="text" id="userInput" placeholder="Ask anything..." required autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('userInput');
    const chat = document.getElementById('chat');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      chat.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const botMsg = document.createElement('div');
      botMsg.className = 'msg bot';
      botMsg.innerText = 'Thinking...';
      chat.appendChild(botMsg);

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: text })
        });
        const data = await res.json();
        botMsg.innerText = data.reply || "Error getting response.";
      } catch (err) {
        botMsg.innerText = "Error connecting to server.";
      }
      chat.scrollTop = chat.scrollHeight;
    });
  </script>
</body>
</html>
